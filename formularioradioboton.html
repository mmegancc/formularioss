<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<h2>Formularios con Radioboton</h2>
<!--Define el url en el que se envían los archivos-->
<form action="" method="post">
Ingresa tu nombre:
<!-- campo en donde se da el nombre clave e identificador-->
<input type="text" name="nombre">
<br>
Selecciona el maximo de estudios que tienes:
<br>
<!-- define las opciones que podras escoger en el formulario-->
<input type="radio" name="estudios" value="1">Sin estudios <br>
<input type="radio" name="estudios" value="2">Primaria <br>
<input type="radio" name="estudios" value="3">Secundaria <br>
<input type="radio" name="estudios" value="4">Preparatoria <br>
<!-- botón de envio-->
<input type="submit" value="enviar">
<!-- botón para limpiar y borrar-->
<input type="reset" value="borrar">
</form>
