<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<h2>Formulario con botones</h2>
<!--Define el url en el que se envían los archivos-->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
<!--voton para envió y dibujo el avión del envio-->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!--botón de reinicio y borarr, dibuja el bote de basura-->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>
