<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<h2>Formularios con seleccion</h2>
<!--Define el url en el que se envían los archivos-->
<form action="" method="post">
Ingresa tu nombre:
<!-- campo en donde se da el nombre clave e identificador-->
<input type="text" name="nombre">

<br>
Selecciona tu pais:
<!-- campo en donde se da el nombre clave e identificador-->
<!-- campo donde esta el identificador-->
<select name="pais">
<!-- opciones donde podras escoger el paia-->
<option value="1">Argentina</option>
<option value="2">España</option>
<option value="3">Mexico</option>
<option value="4">Guatemala</option>
<option value="5">Honduras</option>
<option value="6">El Salvador</option>
<option value="7">Venezuela</option>
<option value="8">Colombia</option>
</select>
<br>
<!-- botón de envio-->
<input type="submit" value="enviar">
<!-- botón de borrar y limpiar-->
<input type="reset" value="borrar">
</form>
