<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<h2>Formulario con text area</h2>
<!--Define el url en el que se envían los archivos-->
<form action="" method="post">
Ingresa tu nombre:
<!-- campo en donde se da el nombre clave e identificador-->
<input type="text" name="nombre">
<br>
Ingresa tu correo:
<!-- campo para los correo y su identificador-->
<input type="email" name="correo">
<br>
Ingresa tus comentarios:
<!-- para que sea para textos largos-->
<textarea name="comentarios" rows="1" cols="10"></textarea>
<br>
<!-- botón de envio-->
<input type="submit" value="enviar">
<!-- botón para limpiar y borrar-->
<input type="reset" value="borrar">
</form>
