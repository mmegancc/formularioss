<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<h2>Formularios con checkbox</h2>
<!--Define el url en el que se envían los archivos-->
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">

<!--Texto que aparecerá para dar una indicacion-->
<br>
Selecciona los lenguajes que conozcas:
<br>
<!--Define las opciones que podras elegir en el formulario-->
<input type="checkbox" name="Java">Java <br>
<input type="checkbox" name="Python"> Python <br>
<input type="checkbox" name="C#">C# <br>
<input type="checkbox" name="Flutter"> Flutter <br>
</form>
