<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<h2>Formulario con limitaciones</h2>
<!--Define el url en el que se envían los archivos-->
<form action="" method="post">
Ingresa tu nombre:
<!-- bloquea por completo el campo -->
<input type="text" name="nombre" disabled><br>
Contraseña:
<!--campo donde se ingresa la contraseña y tiene un limite 5 caracteres-->
<input type="password" name="pass" maxlength="5"><br>
<!-- Area de solo lectura -->
Comentarios:
<textarea name="comentarios" readonly>

Este es mi comentario y no se puede borrar
</textarea><br>
</form>
</body>
</html>
