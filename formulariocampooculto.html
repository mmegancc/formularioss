<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<h2>Formulario con campos ocultos</h2>
<!--Define el url en el que se envían los archivos-->
<form action="" method="post">
<!--Este campo es invisible, es el avlor que se mandara al servidor-->
<input type="hidden" name="hora" value="3:30">
Ingresa tu nombre:
<!-- campo en donde se da el nombre clave e identificador-->
<input type="text" name="nombre">
<br>
<!-- botón de envio del formulario, los visibles e invisibles-->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!-- botón de borrar y limpiar-->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>
