<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>

<h2>Formulario con archivos</h2>
<!--Define el url en el que se envían los archivos-->
<form action="" method="post">

Ingresa tu nombre:
<!-- campo en donde se da el nombre clave e identificador-->
<input type="text" name="nombre">
<br>
<!-- campo en donde se puede elegir los archivos-->
<input type="file" name="archivo">
<br>
<!-- campo enncargado de enviar el formulatio completo-->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!-- campo enncargado de limpiar -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>
